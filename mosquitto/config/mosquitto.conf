# Mosquitto configuration for SkyTrack
# Bind to all interfaces
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (if you want to use MQTT over WebSocket)
listener 9001
protocol websockets

# Logging
log_type all
connection_messages true

# Persistence location
persistence true
persistence_location /mosquitto/data/

# For local/dev usage we allow anonymous so the container can start without a password file.
# In production create a password file with `mosquitto_passwd` and set `allow_anonymous false`.
allow_anonymous true
# password_file /mosquitto/config/passwords

# Increase message queue sizes (tweak if needed)
max_inflight_messages 100
message_size_limit 0

# Security: do not expose anonymous access
# allow_anonymous false

# You can add acl_file /mosquitto/config/acl to limit topic access for users
# acl_file /mosquitto/config/acl

# Listener options
# The main MQTT listener is already defined above as `listener 1883 0.0.0.0`.
# Do not declare a second listener on the same port; keep related options here.
allow_zero_length_clientid true

# Runtime directory (used by image)
# include_dir /mosquitto/conf.d
# The conf.d include was causing startup errors when the directory didn't exist
# If you need to include additional conf fragments, drop them in mosquitto/conf.d
