name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev,test]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ -d "dist" ] || [ -d "build" ]; then
            echo "✅ Build completed successfully!"
          else
            echo "⚠️ Build completed but no dist/build folder found"
          fi
