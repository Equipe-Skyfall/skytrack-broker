
services:
  sensor-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: esp32-sensor-server:latest

    container_name: esp32-sensor-server

    ports:
      - "${PORT:-3000}:3000"

    environment:
      # MongoDB Configuration (from .env file)
      - MONGO_CONNECTION_STRING=${MONGO_CONNECTION_STRING}
      - MONGO_DATABASE=${MONGO_DATABASE:-dadosClima}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-clima}

      # Server Configuration
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}

      # Optional: MQTT Configuration (if using local MQTT broker)
      - MQTT_HOST=${MQTT_HOST:- URL DO SEU BROKER}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_USERNAME=${MQTT_USERNAME:- USUARIO}
      - MQTT_PASSWORD=${MQTT_PASSWORD:- SENHA}

    # Restart policy for production
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

   
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

   
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

   
    labels:
      - "project=esp32-sensors"
      - "service=data-server"
      - "environment=${NODE_ENV:-production}"


networks:
  default:
    name: esp32-sensor-network
    driver: bridge